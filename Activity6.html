<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Day Card</title>
    <link rel="stylesheet" href="style3.css">
    <style>
        .back-btn {
            display: inline-block;
            background: #333;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 15px;
            align-self: flex-start; /* Aligns the button to the top left of the card */
        }
        .back-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="card-container" style="margin: 20px auto; max-width: 650px; display: flex; flex-direction: column;">
        <!-- Back Button inside the card container so it stays top-left -->
        <a href="index.html" class="back-btn">&larr; Back to Portfolio</a>

        <!-- Title Banner -->
        <h1 class="htd">Happy Teacher's Day! 🌸</h1>

        <!-- Content Area -->
        <div class="row">
            <div class="img-box">
                <img src="sir.jpeg" alt="Teacher Photo">
            </div>
            <div class="words">
                <h2>Thank you for your hard work and dedication! This appreciation isn't just for you, but for all the amazing teachers in our school who guide and inspire us every day. We are so lucky to have you!</h2>
            </div>
        </div>

        <!-- Hidden Audio Element -->
        <audio id="myAudio" src="hungry cat.mp3" loop></audio>

        <!-- Cute & Simple Audio Widget -->
        <div class="music-widget">
            <div class="music-info">
                <span class="music-icon">🎵</span>
                <span class="track-title">Hungry Cat</span>
            </div>
            <button id="playBtn" onclick="togglePlay()" aria-label="Play Music">&#9654;</button>
        </div>
    </div>

    <script>
        function togglePlay() {
            var audio = document.getElementById("myAudio");
            var btn = document.getElementById("playBtn");

            if (audio.paused) {
                audio.play();
                btn.innerHTML = "&#10074;&#10074;"; // Pause icon
            } else {
                audio.pause();
                btn.innerHTML = "&#9654;"; // Play icon
            }
        }
    </script>
</body>
</html>
